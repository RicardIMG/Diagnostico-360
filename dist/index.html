<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diagnóstico 360 — inteligência diagnóstica para transformar dados em previsibilidade e decisão." />
    <title>Diagnóstico 360</title>
    <link rel="stylesheet" href="./styles.css?v=20261105-navigation" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen" hidden>
      <form class="login-card" id="loginForm">
        <div class="brand login-brand" aria-label="Diagnóstico 360">
          <span class="brand-mark">360°</span>
          <span><strong>DIAGNÓSTICO 360</strong><small>Ambiente seguro e multiempresa</small></span>
        </div>
        <div><div class="eyebrow">Acesso protegido</div><h1>Entre na plataforma</h1><p>Seus dados, empresas e arquivos são carregados do ambiente centralizado.</p></div>
        <label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="username" required></label>
        <label class="field"><span>Senha</span><input name="password" type="password" autocomplete="current-password" minlength="12" required></label>
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="button gold full" type="submit">Entrar com segurança</button>
      </form>
    </section>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="brand" aria-label="Diagnóstico 360">
          <span class="brand-mark">360°</span>
          <span><strong>DIAGNÓSTICO 360</strong><small>Inteligência tributária & empresarial</small></span>
        </div>
        <nav aria-label="Navegação principal" id="nav"></nav>
        <div class="sidebar-footer">
          <div class="coverage-mini"><span>Cobertura do diagnóstico</span><strong id="coverageMini">87%</strong></div>
          <div class="progress"><i id="coverageBar"></i></div>
          <button class="ghost full" data-action="open-method">Metodologia e limites</button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" data-action="toggle-menu" aria-label="Abrir menu">☰</button>
          <div class="context">
            <label id="tenantContext"><span>Tenant</span><select id="tenantSelect" aria-label="Tenant"></select></label>
            <label><span>Organização</span><select id="orgSelect" aria-label="Organização"></select></label>
            <label><span>Projeto</span><select id="projectSelect" aria-label="Projeto"></select></label>
          </div>
          <div class="top-actions">
            <button class="icon-button notification" data-action="go-pending" aria-label="Ver pendências">◎<b id="notificationCount">0</b></button>
            <button class="profile" data-action="profile"><span id="profileInitials">--</span><span><strong id="profileName">Carregando…</strong><small id="profileRole">Usuário</small></span></button>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>
    <div class="toast-region" id="toasts" aria-live="polite"></div>
    <dialog id="dialog"><div id="dialogContent"></div></dialog>
    <input type="file" id="fileInput" hidden multiple accept=".xml,.csv,.xlsx,.pdf,.zip,.txt" />
    <script type="module" src="./app.js?v=20261105-navigation"></script>
  </body>
</html>
